apiVersion: apps/v1
kind: Deployment
metadata:
  name: o2ims-operator
  namespace: o2ims
  labels:
    app.kubernetes.io/name: nephio-o2ims
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nephio-o2ims
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nephio-o2ims
    spec:
      securityContext:
        runAsNonRoot: true
        runAsGroup: 65535
        runAsUser: 65535
      containers:
      - name: nephio-o2ims
        image: docker.io/nephio/o2ims-operator:2097228064147640320
        imagePullPolicy: IfNotPresent
        # The northbound API listens on loopback only, so it has no port here;
        # kubectl port-forward reaches it.
        ports:
          - name: health
            containerPort: 8080
        # Served by kopf because the image passes --liveness. It answers 500
        # when the northbound API does not accept a connection.
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 10
        env:
        - name: 'UPSTREAM_PKG_REPO'
          value: 'catalog-infra-capi'
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "100m"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      serviceAccountName: o2ims-operator
      terminationGracePeriodSeconds: 5
